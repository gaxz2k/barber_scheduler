# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# O omakase traz rubocop-rails e rubocop-performance como plugins, mas desliga
# os departamentos inteiros. Aqui a formatação dele fica intacta e voltamos a
# ligar só o que caça bug de verdade.
plugins:
  - rubocop-rspec

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "node_modules/**/*"
    - "storage/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

# Erros reais: variáveis não usadas, comparações que nunca batem, rescue vazio.
Lint:
  Enabled: true

# Idiomas de Rails: `find_by` em vez de `where.first`, `pluck`, validações etc.
Rails:
  Enabled: true

# Padrões custosos em loop e alocação desnecessária.
Performance:
  Enabled: true

# Boas práticas de spec: `let` em vez de instância crua, `described_class`, etc.
RSpec:
  Enabled: true

