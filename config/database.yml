default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DATABASE", "barber_scheduler_development") %>

# The test database is disposable and must remain separate from development.
test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DATABASE", "barber_scheduler_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DATABASE", "barber_scheduler_production") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_CABLE_DATABASE", "barber_scheduler_production_cable") %>
    migrations_paths: db/cable_migrate
