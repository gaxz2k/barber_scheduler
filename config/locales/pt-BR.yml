  activerecord:
    attributes:
      barbershop:
        slug:
          # Aparece no formulário de configuração da barbearia, para o
          # administrador entender por que o slug foi recusado.
          invalid: "só pode conter letras minúsculas, números e hífens"
      appointment:
        # `status` é um enum, e o Rails resolve enums por
        # `activerecord.attributes.<model>.<enum>` com pluralização, ou seja,
        # com as chaves `one`/`other`. Sem elas o I18n levanta
        # InvalidPluralizationData no meio de qualquer update de status.
        statuses:
          pending:
            one: "Aguardando"
            other: "Aguardando"
          confirmed:
            one: "Confirmado"
            other: "Confirmado"
          canceled:
            one: "Cancelado"
            other: "Cancelado"
          completed:
            one: "Concluído"
            other: "Concluído"
